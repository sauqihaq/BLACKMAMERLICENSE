name: Publish BLACKMAMERSTUDIO Extension V4.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-extension-v42.yml'
      - 'tools/publish-extension-v42.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund typescript@5.9.3
      - name: Build signed obfuscated extension from existing repository ZIP
        run: node tools/publish-extension-v42.cjs
      - name: Commit replacement archive to the website's existing download path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/BlackMamer-v4.zip
          if git diff --cached --quiet; then
            echo "No ZIP change required"
          else
            git commit -m "release: publish BLACKMAMERSTUDIO V4.2 obfuscated + signed extension"
            git push origin HEAD:main
          fi
