name: Verify BLACKMAMERLICENSE
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and unit tests
        run: |
          node --check public/admin.js
          node --check public/store.js
          node --check public/ai-chat.js
          node --check lib/routes/ai-chat.js
          node --check lib/ai-chat-logic.js
          node --check userscript/tool-client-template.user.js
          node --check public/admin-delivery.js
          npm test
      - name: Validate lightweight Baileys dependency and adapter
        working-directory: whatsapp-bot
        run: |
          node --check index.js
          node --check baileys-client.js
          node --check baileys-message.js
          npm install --no-audit --no-fund
          node --input-type=module -e "import('./baileys-client.js').then(m => { if (typeof m.Client !== 'function') process.exit(2); console.log('Baileys adapter import OK') })"
